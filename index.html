        let currentIndex = 0;
        let typewriterTimeout;
        let isAudioPlaying = false;
        let audioCtx = null;
        let intervalId = null;

        // Particle Canvas Logic
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? '#38bdf8' : '#a855f7';
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.1)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        const teacherMenu = document.getElementById('teacherMenu');
        
        function renderSidebar() {
            teacherMenu.innerHTML = '';
            teachersData.forEach((teacher, idx) => {

                        <span>${teacher.subject}</span>
                    </div>
                `;
                teacherMenu.appendChild(btn);
            });
        }

            const teacher = teachersData[currentIndex];

            const typewriterText = document.getElementById('typewriterText');

                    charIdx++;
                    typewriterTimeout = setTimeout(typeBio, 22);

            }
            typeBio();

            if (isAudioPlaying) {
                startMelody();

        // Deep Speaker Audio Synthesizer Beat
        function playTone(freq, duration) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startMelody() {
            stopMelody();
            isAudioPlaying = true;
            document.getElementById('audioToggleBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            document.getElementById('audioStatus').textContent = "Playing Beat";

            let noteStep = 0;
            const notes = teachersData[currentIndex].notes;

            intervalId = setInterval(() => {
                playTone(notes[noteStep % notes.length], 0.6);
                noteStep++;
            }, 400);
        }

        function stopMelody() {
            if (intervalId) clearInterval(intervalId);
            isAudioPlaying = false;
            document.getElementById('audioToggleBtn').innerHTML = `<i class="fa-solid fa-play"></i>`;
            document.getElementById('audioStatus').textContent = "Play Music";
        }

        document.getElementById('audioToggleBtn').addEventListener('click', () => {
            if (isAudioPlaying) {
                stopMelody();
            } else {
                startMelody();
            }
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            const newIndex = (currentIndex - 1 + teachersData.length) % teachersData.length;
            selectTeacher(newIndex);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            const newIndex = (currentIndex + 1) % teachersData.length;
            selectTeacher(newIndex);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
            if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        document.getElementById('fullScreenBtn').addEventListener('click', toggleFullScreen);

        const sidebar = document.getElementById('sidebar');
        document.getElementById('menuToggle').addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        selectTeacher(0);
    </script>
</body>
</html>
