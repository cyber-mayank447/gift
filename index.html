<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru Purnima Special - Teachers Tribute Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030712;
            --primary-glow: #38bdf8;
            --accent-glow: #a855f7;
            --card-bg: rgba(15, 23, 42, 0.95);
            --border-color: rgba(255, 255, 255, 0.18);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* Top Header */
        .portal-header {
            text-align: center;
        }

        .portal-header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #a855f7, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .portal-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* HOME PAGE CIRCLES GRID */
        .teachers-circles-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 35px;
            width: 100%;
            padding: 20px 0;
        }

        .teacher-circle-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: none;
            border: none;
            color: inherit;
        }

        .teacher-circle-card:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .circle-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: #fff;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .teacher-circle-card:hover .circle-avatar {
            border-color: #38bdf8;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
        }

        .circle-name {
            margin-top: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            text-align: center;
            transition: color 0.3s ease;
        }

        .teacher-circle-card:hover .circle-name {
            color: #38bdf8;
        }

        .circle-subject {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 2px;
        }

        /* --- POPUP / MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 30px 35px 35px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        /* Top Bar Layout Inside Card */
        .card-top-bar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }

        .subject-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        /* Right Actions Column (Close TOP, Play Music BOTTOM) */
        .corner-controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        /* Close Button TOP */
        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #f43f5e;
            border-color: #f43f5e;
            transform: rotate(90deg);
        }

        /* Play Music Box BOTTOM (Compact/Short Icon & Button) */
        .audio-control-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px 4px 4px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .audio-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .audio-btn:hover {
            transform: scale(1.1);
        }

        .audio-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card-header {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }

        .teacher-title-box h2 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .teacher-role {
            font-size: 1.05rem;
            color: #e2e8f0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bio-box {
            background: rgba(2, 6, 23, 0.6);
            border-left: 5px solid var(--primary-glow);
            padding: 22px 28px;
            border-radius: 16px;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
        }

        .bio-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #f1f5f9;
        }

        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .tag-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.88rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .portal-header h1 {
                font-size: 2.2rem;
            }

            .circle-avatar {
                width: 85px;
                height: 85px;
                font-size: 1.8rem;
            }

            .modal-card {
                padding: 25px 20px;
            }

            .card-top-bar {
                flex-direction: row;
                align-items: flex-start;
            }

            .teacher-title-box h2 {
                font-size: 2rem;
            }

            .bio-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="main-wrapper">
        <header class="portal-header">
            <h1><i class="fa-solid fa-graduation-cap"></i> Guru Purnima Special</h1>
            <p>Class 12 - 2026 Batch Teachers Tribute</p>
        </header>

        <!-- HOME PAGE CIRCLES GRID -->
        <div class="teachers-circles-container" id="homeCirclesContainer"></div>
    </div>

    <!-- POPUP MODAL CARD -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card" id="modalCard">

            <!-- TOP CORNER BAR WITH BADGE & RIGHT SIDE CONTROLS -->
            <div class="card-top-bar">
                <div class="subject-badge" id="subjectBadge">
                    <i class="fa-solid fa-star"></i> Tribute Gallery
                </div>

                <div class="corner-controls">
                    <!-- 1. Close Button (X) AT TOP -->
                    <button class="close-btn" id="closeModalBtn" title="Close Card">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                    <!-- 2. Compact Play Music Button BELOW -->
                    <div class="audio-control-box">
                        <button class="audio-btn" id="audioToggleBtn" title="Play Music">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <div class="audio-status" id="audioStatus">Play Music</div>
                    </div>
                </div>
            </div>

            <div class="card-header">
                <div class="teacher-title-box">
                    <h2 id="teacherName">Teacher Name</h2>
                    <div class="teacher-role" id="teacherRole">
                        <i class="fa-solid fa-chalkboard-user"></i> Subject
                    </div>
                </div>
            </div>

            <div class="bio-box">
                <p class="bio-text" id="typewriterText"></p>
            </div>

            <div class="feature-tags" id="featureTags"></div>
        </div>
    </div>

    <script>
        const teachersData = [
            {
                id: "seema",
                name: "Seema Ma'am",
                role: "Senior Science Educator",
                subject: "Biology",
                icon: "fa-atom",
                photoUrl: "",
                badgeBg: "rgba(56, 189, 248, 0.15)",
                badgeBorder: "#38bdf8",
                badgeColor: "#38bdf8",
                gradient: "linear-gradient(135deg, #38bdf8, #a855f7)",
                glowColor: "rgba(56, 189, 248, 0.4)",
                bio: "Jaise Quantum Mechanics me energy levels electrons ko excite karte hain, waise hi aapka guidance humare brain ke hidden talent ko activate karta hai! Science ke complex concepts ko practical truth me badalne ke liye—Happy Guru Purnima Seema Ma'am!",
                tags: ["Quantum Energy", "Reaction Catalyst", "Exothermic Inspiration"],
                notes: [261.63, 329.63, 392.00, 523.25]
            },
            {
                id: "gaurav",
                name: "Gaurav Sir",
                role: "Accounts & Mathematics Master",
                subject: "Commerce & Accountancy",
                icon: "fa-calculator",
                photoUrl: "",
                badgeBg: "rgba(251, 191, 36, 0.15)",
                badgeBorder: "#fbbf24",
                badgeColor: "#fbbf24",
                gradient: "linear-gradient(135deg, #fbbf24, #f97316)",
                glowColor: "rgba(251, 191, 36, 0.4)",
                bio: "Financial statements se lekar real life ki balance sheet tak, aapne sikhaya hai ki struggle agar 'Debit' ho toh success ka 'Credit' pakka hai! Complex mathematics ki tarah life ki problems ke derivatives ko simple banane aur humare future ka net profit badhane ke liye—Happy Guru Purnima Gaurav Sir!",
                tags: ["Balance Sheet Master", "Debit-Credit Logic", "Net Profit Mentor"],
                notes: [293.66, 369.99, 440.00, 587.33]
            },
            {
                id: "mithilesh",
                name: "Mithilesh Ma'am",
                role: "Class Teacher & English Specialist",
                subject: "English Literature",
                icon: "fa-book-open-reader",
                photoUrl: "",
                badgeBg: "rgba(52, 211, 153, 0.15)",
                badgeBorder: "#34d399",
                badgeColor: "#34d399",
                gradient: "linear-gradient(135deg, #34d399, #10b981)",
                glowColor: "rgba(52, 211, 153, 0.4)",
                bio: "You always guide us like a true mentor. Thank you for making learning so simple and fun for us. Wishing you a very Happy Guru Purnima, Mithilesh Ma'am!",
                tags: ["Flawless Syntax", "Class Anchor", "Literary Mentor"],
                notes: [329.63, 392.00, 493.88, 659.25]
            },
            {
                id: "kusumlata",
                name: "Kusumlata Ma'am",
                role: "Hindi Literature Expert",
                subject: "हिंदी साहित्य",
                icon: "fa-feather-pointed",
                photoUrl: "",
                badgeBg: "rgba(244, 63, 94, 0.15)",
                badgeBorder: "#f43f5e",
                badgeColor: "#f43f5e",
                gradient: "linear-gradient(135deg, #f43f5e, #fb7185)",
                glowColor: "rgba(244, 63, 94, 0.4)",
                bio: "आप सिर्फ हिंदी नहीं पढ़ातीं, बल्कि शब्दों से अपने विचार व्यक्त करना सिखाती हैं। कबीर के दोहों से लेकर व्याकरण तक, सब आसान बनाने के लिए धन्यवाद। गुरु पूर्णिमा की हार्दिक शुभकामनाएं कुसुमलता मैम!",
                tags: ["साहित्य रस", "परिष्कृत विचार", "काव्य मार्गदर्शक"],
                notes: [349.23, 440.00, 523.25, 698.46]
            },
            {
                id: "amit",
                name: "Amit Sir",
                role: "IT & Coding Lead",
                subject: "Computer Science",
                icon: "fa-code",
                photoUrl: "",
                badgeBg: "rgba(168, 85, 247, 0.15)",
                badgeBorder: "#a855f7",
                badgeColor: "#a855f7",
                gradient: "linear-gradient(135deg, #a855f7, #6366f1)",
                glowColor: "rgba(168, 85, 247, 0.4)",
                bio: "Thank you for making technology simple, algorithms clear, and coding fun. Wishing a very Happy Guru Purnima, Amit Sir!",
                tags: ["System Architect", "Algorithmic Logic", "Error Debugger"],
                notes: [220.00, 277.18, 329.63, 440.00]
            }
        ];

        let activeTeacherIndex = -1;
        let typewriterTimeout;
        let isAudioPlaying = false;
        let audioCtx = null;
        let intervalId = null;

        // Background Particles
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? '#38bdf8' : '#a855f7';
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.1)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // Render Home Circles
        const homeCirclesContainer = document.getElementById('homeCirclesContainer');
        function renderHomeCircles() {
            homeCirclesContainer.innerHTML = '';
            teachersData.forEach((teacher, idx) => {
                const circleBtn = document.createElement('div');
                circleBtn.className = 'teacher-circle-card';
                circleBtn.onclick = () => openTeacherModal(idx);

                const avatarStyle = teacher.photoUrl 
                    ? `background-image: url('${teacher.photoUrl}');` 
                    : `background: ${teacher.gradient};`;

                const avatarContent = teacher.photoUrl ? '' : `<i class="fa-solid ${teacher.icon}"></i>`;

                circleBtn.innerHTML = `
                    <div class="circle-avatar" style="${avatarStyle}">
                        ${avatarContent}
                    </div>
                    <div class="circle-name">${teacher.name}</div>
                    <div class="circle-subject">${teacher.subject}</div>
                `;
                homeCirclesContainer.appendChild(circleBtn);
            });
        }

        // Open Modal Function
        function openTeacherModal(index) {
            activeTeacherIndex = index;
            const teacher = teachersData[index];
            
            const modalOverlay = document.getElementById('modalOverlay');
            const modalCard = document.getElementById('modalCard');
            
            modalCard.style.boxShadow = `0 20px 60px rgba(0,0,0,0.8), 0 0 80px ${teacher.glowColor}`;
            
            const subjectBadge = document.getElementById('subjectBadge');
            subjectBadge.style.background = teacher.badgeBg;
            subjectBadge.style.border = `1px solid ${teacher.badgeBorder}`;
            subjectBadge.style.color = teacher.badgeColor;
            subjectBadge.innerHTML = `<i class="fa-solid ${teacher.icon}"></i> ${teacher.role}`;

            const teacherName = document.getElementById('teacherName');
            teacherName.textContent = teacher.name;
            teacherName.style.background = teacher.gradient;
            teacherName.style.webkitBackgroundClip = "text";
            teacherName.style.webkitTextFillColor = "transparent";

            document.getElementById('teacherRole').innerHTML = `<i class="fa-solid ${teacher.icon}"></i> ${teacher.subject}`;

            const featureTags = document.getElementById('featureTags');
            featureTags.innerHTML = '';
            teacher.tags.forEach(tag => {
                const pill = document.createElement('span');
                pill.className = 'tag-pill';
                pill.innerHTML = `<i class="fa-solid fa-star" style="color: ${teacher.badgeColor}"></i> ${tag}`;
                featureTags.appendChild(pill);
            });

            clearTimeout(typewriterTimeout);
            const typewriterText = document.getElementById('typewriterText');
            typewriterText.innerHTML = '';
            
            let charIdx = 0;
            function typeBio() {
                if (charIdx < teacher.bio.length) {
                    typewriterText.innerHTML += teacher.bio.charAt(charIdx);
                    charIdx++;
                    typewriterTimeout = setTimeout(typeBio, 18);
                }
            }
            typeBio();

            modalOverlay.classList.add('active');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            stopMelody();
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        // Audio Logic
        function playTone(freq, duration) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startMelody() {
            if (activeTeacherIndex === -1) return;
            stopMelody();
            isAudioPlaying = true;
            document.getElementById('audioToggleBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            document.getElementById('audioStatus').textContent = "Playing Beat";

            let noteStep = 0;
            const notes = teachersData[activeTeacherIndex].notes;

            intervalId = setInterval(() => {
                playTone(notes[noteStep % notes.length], 0.6);
                noteStep++;
            }, 400);
        }

        function stopMelody() {
            if (intervalId) clearInterval(intervalId);
            isAudioPlaying = false;
            document.getElementById('audioToggleBtn').innerHTML = `<i class="fa-solid fa-play"></i>`;
            document.getElementById('audioStatus').textContent = "Play Music";
        }

        document.getElementById('audioToggleBtn').addEventListener('click', () => {
            if (isAudioPlaying) stopMelody();
            else startMelody();
        });

        renderHomeCircles();
    </script>
</body>
</html>
