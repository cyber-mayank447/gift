<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Teachers' Day | Mithilesh Ma'am</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#000,#222,#444);
}

.card{
    width:500px;
    padding:50px;
    text-align:center;
    color:white;
    background:rgba(15,15,15,.9);
    border-radius:30px;
    box-shadow:0 0 180px rgba(255,215,0,.4);
}

h1{
    color:#FFD700;
    margin-bottom:15px;
}

h2{
    margin-bottom:20px;
}

#message{
    color:#eee;
    font-size:16px;
    line-height:1.8;
    min-height:160px;
    white-space:pre-line;
}

button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.1);
}

.heart{
    position:absolute;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100vh);
    }
}
</style>

</head>

<body>

<div class="card">

<h1>🌸Happy Teacher Day🌸</h1>

<h2>Dear Mithilesh Ma'am ❤️</h2>

<p id="message"></p>

<button onclick="openGift()">🎁 Open Gift</button>

</div>


<script>

const text=`Thank you for your unwavering guidance,
wisdom, and encouragement.

Your dedication inspires me to learn,
grow, and achieve my goals.

Wishing you happiness,
good health, and endless success.

🌹 Happy Teachers' Day! 💖

With Respect,
Your Student`;

let index=0;

function openGift(){

    document.querySelector("button").style.display="none";

    let box=document.getElementById("message");

    function typing(){

        if(index < text.length){

            box.innerHTML += text.charAt(index);

            index++;

            setTimeout(typing,50);

        }

    }

    typing();
}


function createHeart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=["❤️","🌸","✨","💖"][Math.floor(Math.random()*4)];

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(h);

setTimeout(()=>h.remove(),6000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
